name: Deploy Microservices

on:
  push:
    branches: [ "deployment" ]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
    # 1. Checkout Code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Inject Secrets (Robust Version)
    - name: Inject Secrets
      run: |
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        Write-Host "--- STARTING SECRETS INJECTION ---"
        
        $envSecret = @"
        ${{ secrets.ENV_FILE_CONTENT }}
        "@
        
        # 1. Create/Update root .env file
        Set-Content -Path ".env" -Value $envSecret
        Write-Host "Created root .env file"

        # 2. Update service-specific .env.docker files
        $services = @(
            "frontend",
            "services/api-gateway",
            "services/auth-service",
            "services/employee-service",
            "services/attendance-service",
            "services/application-service",
            "services/ai-face-recognition-service",
            "services/salary-service",
            "services/job-service",
            "services/notification-service"
        )

        foreach ($svc in $services) {
            $path = "./$svc/.env.docker"
            if (Test-Path "./$svc") {
                if (Test-Path $path) {
                    # Ensure existing file ends with a newline before appending
                    $content = Get-Content $path -Raw
                    if ($content -and -not $content.EndsWith("`n") -and -not $content.EndsWith("`r`n")) {
                        Add-Content -Path $path -Value "`n"
                    }
                    Add-Content -Path $path -Value $envSecret
                    Write-Host "Updated .env.docker for: $svc"
                } else {
                    Set-Content -Path $path -Value $envSecret
                    Write-Host "Created new .env.docker for: $svc"
                }
            }
        }
        Write-Host "--- SECRETS INJECTION COMPLETED ---"

    # 3. Inject AI Models
    - name: Inject AI Models
      run: |
        Write-Host "--- COPYING AI MODELS FROM HOST ---"
        $sourceModelPath = "C:\Users\Toan\.insightface\models"
        $destParentPath = "./services/ai-face-recognition-service"

        if (Test-Path $sourceModelPath) {
            if (-not (Test-Path $destParentPath)) {
                New-Item -ItemType Directory -Force -Path $destParentPath
            }
            Copy-Item -Path $sourceModelPath -Destination $destParentPath -Recurse -Force
            Write-Host "AI Models successfully injected"
        } else {
            Write-Host "ERROR: AI Models not found at: $sourceModelPath"
            exit 1 
        }

    # 4. Cleanup and Prune
    - name: Docker Cleanup
      run: |
        Write-Host "--- CLEANING UP ---"
        docker-compose down --remove-orphans
        docker image prune -f
        # Clear BuildKit cache to fix snapshot/cache corruption issues
        docker builder prune -a -f
        Write-Host "Cleanup finished"

    # 5. Build and Deploy
    - name: Build and Deploy
      run: |
        Write-Host "--- BUILDING AND STARTING SERVICES ---"
        # Using --build to ensure environment changes are captured
        docker-compose up -d --build
        Write-Host "--- DEPLOYMENT COMPLETED ---"