name: Deploy Microservices

on:
  push:
    branches: [ "deployment" ]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
    # 1. Checkout Code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Inject Secrets (Clean Version - No Special Chars)
    - name: Inject Secrets
      run: |
        # Set encoding to avoid special character issues
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        Write-Host "--- STARTING SECRET INJECTION ---"
        
        # Prepare content from GitHub Secret
        $envSecret = @"
        
        # --- INJECTED SECRETS ---
        ${{ secrets.ENV_FILE_CONTENT }}
        "@
        
        # 1. Create root .env file (for docker-compose)
        Set-Content -Path ".env" -Value $envSecret
        Write-Host "Created root .env file"

        # 2. List of services to inject secrets into
        # Paths are relative to project root
        $servicePaths = @(
            "frontend",
            "services/application-service",
            "services/job-service",
            "services/ai-face-recognition-service",
            "services/auth-service",
            "services/employee-service",
            "services/attendance-service",
            "services/salary-service",
            "services/notification-service",
            "services/api-gateway"
        )

        foreach ($svcPath in $servicePaths) {
            # Check if service directory exists
            if (Test-Path "./$svcPath") {
                $envFile = "./$svcPath/.env.docker"
                
                # If .env.docker exists, append secrets
                if (Test-Path $envFile) {
                    Add-Content -Path $envFile -Value $envSecret
                    Write-Host "Updated: $svcPath"
                } else {
                    # If not exists, create new with secrets
                    Set-Content -Path $envFile -Value $envSecret
                    Write-Host "Created new: $svcPath"
                }
            } else {
                Write-Host "Skipping: $svcPath (Directory not found)"
            }
        }
        
        Write-Host "--- SECRET INJECTION COMPLETED ---"

    # 3. Inject AI Models (Specific to local runner)
    - name: Inject AI Models
      run: |
        Write-Host "--- STARTING MODEL INJECTION ---"
        
        # Absolute path on Toan's Host Machine
        $sourceModelPath = "C:\Users\Toan\.insightface\models"
        
        # Destination path inside the repo structure
        $destParentPath = "./services/ai-face-recognition-service"

        if (Test-Path $sourceModelPath) {
            # Copy models recursively
            Copy-Item -Path $sourceModelPath -Destination $destParentPath -Recurse -Force
            Write-Host "AI Models copied successfully"
        } else {
            Write-Host "WARNING: Models folder not found at $sourceModelPath"
            # We exit with error to avoid running service without models
            exit 1 
        }

    # 4. Clean up old Docker resources
    - name: Cleanup Old Resources
      run: |
        Write-Host "--- STARTING CLEANUP ---"
        # Stop containers and remove orphans
        docker-compose down --remove-orphans
        
        # Remove dangling images to free space
        docker image prune -f
        Write-Host "Cleanup completed"

    # 5. Build and Deploy
    - name: Build and Deploy
      run: |
        Write-Host "--- STARTING BUILD AND DEPLOY ---"
        # Build without cache if needed, or normal build
        docker-compose up -d --build
        Write-Host "--- DEPLOYMENT SUCCESSFUL ---"