name: Deploy Optimized (Auto-Clean)

on:
  push:
    branches: [ "deployment" ]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
    # 1. Checkout Code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Smart Inject Secrets
    - name: Smart Inject Secrets
      run: |
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        Write-Host "--- STARTING SECRET INJECTION ---"
        
        $envSecret = @"
        ${{ secrets.ENV_FILE_CONTENT }}
        "@
        
        function Update-File-If-Changed ($filePath, $newContent) {
            if (Test-Path $filePath) {
                $currentContent = Get-Content $filePath -Raw
                $cleanCurrent = $currentContent -replace "`r`n", "`n" -replace "`n", ""
                $cleanNew = $newContent -replace "`r`n", "`n" -replace "`n", ""
                if ($cleanCurrent -eq $cleanNew) {
                    Write-Host "   Skipping: $filePath"
                    return
                }
            }
            Set-Content -Path $filePath -Value $newContent
            Write-Host "   Updated: $filePath"
        }

        Update-File-If-Changed ".env" $envSecret
        
        $services = @("frontend", "services/api-gateway", "services/auth-service", "services/employee-service", "services/attendance-service", "services/application-service", "services/ai-face-recognition-service", "services/salary-service", "services/job-service", "services/notification-service")
        
        foreach ($svc in $services) {
            if (Test-Path "./$svc") { Update-File-If-Changed "./$svc/.env.docker" $envSecret }
        }
        Write-Host "--- INJECTION COMPLETED ---"

    # 3. Inject AI Models
    - name: Inject AI Models
      run: |
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        Write-Host "--- INJECTING AI MODELS ---"
        $sourceModelPath = "C:\Users\Toan\.insightface\models"
        $destParentPath = "./services/ai-face-recognition-service"
        if (Test-Path $sourceModelPath) {
             Copy-Item -Path $sourceModelPath -Destination $destParentPath -Recurse -Force
             Write-Host "   Models copied successfully"
        } else {
             Write-Host "   Warning: Models not found at $sourceModelPath"
        }

    # 4. Build and Deploy
    - name: Build and Deploy
      run: |
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        Write-Host "--- BUILDING SERVICES ---"
        docker-compose up -d --build
        Write-Host "--- DEPLOY SUCCESSFUL ---"

    # 5. Aggressive Cleanup (Save Disk Space)
    - name: Aggressive Cleanup
      run: |
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        Write-Host "--- STARTING DEEP CLEAN ---"
        
        # Remove old Docker images (Dangling)
        docker image prune -f
        
        # Remove Build cache (Save 20-30GB)
        docker builder prune -a -f
        
        # Report status
        Write-Host "Current Docker Usage:"
        docker system df
        
        Write-Host "--- SYSTEM CLEANED ---"