name: Deploy Optimized (Auto-Clean)

on:
  push:
    branches: [ "deployment_v1" ]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
    # 1. Checkout Code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Smart Inject Secrets
    - name: Smart Inject Secrets
      run: |
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        Write-Host "--- STARTING SECRET INJECTION ---"
        
        $envSecret = @"
        ${{ secrets.ENV_FILE_CONTENT }}
        SMTP_PASS=${{ secrets.GG_EMAIL_PASS }}
        "@
        
        # Hàm update file thông minh
        function Update-Or-Create-File ($filePath, $newContent) {
            # Tạo thư mục cha nếu chưa tồn tại
            $parentDir = Split-Path -Parent $filePath
            if ($parentDir -and -not (Test-Path $parentDir)) {
                New-Item -ItemType Directory -Force -Path $parentDir | Out-Null
            }

            if (Test-Path $filePath) {
                # Nếu file tồn tại: Merge nội dung
                $currentContent = Get-Content $filePath -Raw
                # Thêm xuống dòng nếu chưa có
                if ($currentContent -and !$currentContent.EndsWith("`n")) {
                    $currentContent += "`n"
                }
                
                $mergedContent = $currentContent + $newContent
                Set-Content -Path $filePath -Value $mergedContent
                Write-Host "   Merged secrets into: $filePath"
            } else {
                # Nếu file KHÔNG tồn tại: Tạo mới
                Set-Content -Path $filePath -Value $newContent
                Write-Host "   Created new file: $filePath"
            }
        }

        # Cập nhật file .env gốc
        Update-Or-Create-File ".env" $envSecret
        
        # Danh sách các folder chứa service cần tạo file .env.docker
        $services = @("frontend", "services/api-gateway", "services/auth-service", "services/employee-service", "services/attendance-service", "services/application-service", "services/ai-face-recognition-service", "services/salary-service", "services/job-service", "services/notification-service")
        
        foreach ($svc in $services) {
            $dockerEnvPath = "./$svc/.env.docker"
            Update-Or-Create-File $dockerEnvPath $envSecret
        }
        Write-Host "--- INJECTION COMPLETED ---"

    # 3. Inject AI Models
    - name: Inject AI Models
      run: |
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        Write-Host "--- INJECTING AI MODELS ---"
        Copy-Item -Path "C:\Users\Toan\.insightface\models" -Destination "./services/ai-face-recognition-service" -Recurse -Force
        Write-Host "--- ALL MODELS READY ---"

    # 4. Build and Deploy
    - name: Build and Deploy
      run: |
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        Write-Host "--- BUILDING AND STARTING SERVICES ---"
        # Reverting to simple build to ensure better incremental performance on self-hosted runner
        docker-compose up -d --build
        Write-Host "--- DEPLOY SUCCESSFUL ---"