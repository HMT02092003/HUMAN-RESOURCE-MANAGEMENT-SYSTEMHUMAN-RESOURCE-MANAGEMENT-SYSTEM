name: Deploy Microservices

on:
  push:
    branches: [ "deployment" ]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
    # 1. Lay code ve
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Nap Secret (Phien ban sach, khong icon)
    - name: Inject Secrets
      run: |
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        Write-Host "--- BAT DAU NAP SECRET ---"
        
        $envSecret = @"
        ${{ secrets.ENV_FILE_CONTENT }}
        "@
        
        # Ghi file .env goc
        Set-Content -Path ".env" -Value $envSecret
        Write-Host "Da tao file .env goc"

        # Danh sach cac service can nap them secret
        $services = @(
            "application-service", 
            "job-service", 
            "ai-face-recognition-service", 
            "auth-service", 
            "employee-service",
            "attendance-service",
            "salary-service",
            "notification-service"
        )

        foreach ($svc in $services) {
             $path = "./services/$svc/.env.docker"
             if (Test-Path $path) { 
                Add-Content -Path $path -Value $envSecret 
                Write-Host "Da cap nhat: $svc"
             } else { 
                Set-Content -Path $path -Value $envSecret 
                Write-Host "Da tao moi: $svc"
             }
        }
        Write-Host "--- NAP SECRET HOAN TAT ---"

    # 3. Copy Model AI (DA CAP NHAT DUONG DAN CUA TOAN)
    - name: Inject AI Models
      run: |
        Write-Host "--- COPY MODEL AI TU MAY LOCAL ---"
        
        # !!! DUONG DAN CHINH XAC TREN MAY TOAN !!!
        $sourceModelPath = "C:\Users\Toan\.insightface\models"
        
        # Duong dan dich (trong Runner)
        $destParentPath = "./services/ai-face-recognition-service"

        if (Test-Path $sourceModelPath) {
            # Copy toan bo folder models vao trong thu muc service
            Copy-Item -Path $sourceModelPath -Destination $destParentPath -Recurse -Force
            Write-Host "Copy model thanh cong!"
        } else {
            Write-Host "LOI: Khong tim thay folder models tai: $sourceModelPath"
            exit 1 
        }

    # 4. Don dep rac
    - name: Cleanup Old Docker
      run: |
        Write-Host "--- DANG DON DEP ---"
        docker-compose down --remove-orphans
        docker image prune -f

    # 5. Build va Deploy
    - name: Build and Deploy
      run: |
        Write-Host "--- DANG BUILD VA DEPLOY ---"
        docker-compose up -d --build
        Write-Host "--- THANH CONG! WEB DA CHAY ---"