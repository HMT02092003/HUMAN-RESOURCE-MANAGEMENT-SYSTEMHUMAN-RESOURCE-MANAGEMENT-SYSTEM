name: Deploy Microservices

on:
  push:
    branches: [ "deployment" ]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
    # 1. Lay code moi nhat ve
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Nap Secret vao cac file .env (Viet thang duong dan, khong dung vong lap)
    - name: Inject Secrets to Environment Files
      run: |
        # Thiet lap ma hoa tieng Viet/UTF-8 de khong bi loi ky tu la
        [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
        Write-Host "--- BAT DAU NAP SECRET ---"
        
        # Lay noi dung tu GitHub Secret
        $envSecret = @"
        
        # --- INJECTED SECRETS FROM GITHUB ---
        ${{ secrets.ENV_FILE_CONTENT }}
        "@
        
        # --- FILE 1: ROOT .ENV (Cho docker-compose doc) ---
        # Tao moi hoac ghi de file .env o thu muc goc
        Set-Content -Path ".env" -Value $envSecret
        Write-Host "-> Da tao file .env goc"

        # --- FILE 2: APPLICATION SERVICE ---
        $appFile = "./services/application-service/.env.docker"
        if (Test-Path $appFile) {
            Add-Content -Path $appFile -Value $envSecret
            Write-Host "-> Da cap nhat: application-service"
        } else {
            Set-Content -Path $appFile -Value $envSecret
            Write-Host "-> Da tao moi: application-service"
        }

        # --- FILE 3: JOB SERVICE ---
        $jobFile = "./services/job-service/.env.docker"
        if (Test-Path $jobFile) {
            Add-Content -Path $jobFile -Value $envSecret
            Write-Host "-> Da cap nhat: job-service"
        } else {
            Set-Content -Path $jobFile -Value $envSecret
            Write-Host "-> Da tao moi: job-service"
        }

        # --- BAN CO THE COPY DOAN TREN DE THEM CHO CAC SERVICE KHAC O DAY ---
        
        Write-Host "--- NAP SECRET HOAN TAT ---"

    # 3. Don dep rac
    - name: Cleanup Old Docker
      run: |
        Write-Host "--- DANG DON DEP ---"
        # Tat container cu
        docker-compose down --remove-orphans
        
        # Xoa image rac
        docker image prune -f

    # 4. Build va Chay lai
    - name: Build & Deploy
      run: |
        Write-Host "--- DANG BUILD VA DEPLOY ---"
        
        # Build va chay lai
        docker-compose up -d --build
        
        Write-Host "--- THANH CONG! WEB DA CHAY ---"