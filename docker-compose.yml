# ============================================================================
# HUMAN RESOURCE MANAGEMENT SYSTEM - MICROSERVICES ARCHITECTURE
# ============================================================================
# Docker Compose configuration for complete microservices deployment
# Includes: 9 services + PostgreSQL + RabbitMQ
# Total RAM usage: ~6-7GB (suitable for 16GB machine)
# ============================================================================

services:
  # ==========================================================================
  # DATABASE LAYER - PostgreSQL with pgvector extension
  # ==========================================================================
  postgres:
    image: pgvector/pgvector:pg17
    container_name: hrms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: postgres
    ports:
      - "5433:5432" # Host:Container - Avoid conflict with local PostgreSQL on 5432
    volumes:
      # Persistent data storage
      - postgres-data:/var/lib/postgresql/data
      # Auto-initialize databases from dump files
      - ./db_data:/docker-entrypoint-initdb.d
    networks:
      - hrms-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ==========================================================================
  # MESSAGE BROKER - Using CloudAMQP (cloud-hosted RabbitMQ)
  # ==========================================================================
  # RabbitMQ container disabled - using CloudAMQP service instead
  # Configure CLOUDAMQP_URL in service .env files
  # Fallback: Services auto-switch to synchronous processing if CloudAMQP unavailable
  # ==========================================================================

  # rabbitmq:
  #   image: rabbitmq:3.12-management-alpine
  #   container_name: hrms-rabbitmq
  #   restart: unless-stopped
  #   environment:
  #     RABBITMQ_DEFAULT_USER: admin
  #     RABBITMQ_DEFAULT_PASS: admin123
  #   ports:
  #     - "5672:5672"
  #     - "15672:15672"
  #   networks:
  #     - hrms-network

  # ==========================================================================
  # SERVICE LAYER - Backend Microservices
  # ==========================================================================

  # --------------------------------------------------------------------------
  # Frontend - Next.js Application (Port 3001) - Production Mode
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_GATEWAY_URL=
        - NEXT_PUBLIC_NOTIFICATION_SERVICE_URL=
    container_name: hrms-frontend
    restart: unless-stopped
    ports:
      - "3001:3001" # Host: 3001, Container: 3001
    environment:
      - PORT=3001
      - NODE_ENV=production
      - NEXT_PUBLIC_API_GATEWAY_URL=
      - NEXT_PUBLIC_NOTIFICATION_SERVICE_URL=
    depends_on:
      - api-gateway
    networks:
      - hrms-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # --------------------------------------------------------------------------
  # API Gateway - Entry point for all client requests (Port 4100)
  # --------------------------------------------------------------------------
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: hrms-api-gateway
    restart: unless-stopped
    ports:
      - "4100:4100"
    volumes:
      # Hot reload support
      - ./services/api-gateway:/app
      - /app/node_modules
    environment:
      - PORT=4100
      - NODE_ENV=production
      # Service discovery URLs (Internal Docker Network)
      - AUTH_SERVICE_URL=http://auth-service:4101
      - EMPLOYEE_SERVICE_URL=http://employee-service:4102
      - ATTENDANCE_SERVICE_URL=http://attendance-service:4103
      - APPLICATION_SERVICE_URL=http://application-service:4108
      - AI_FACE_RECOGNITION_SERVICE_URL=http://ai-face-recognition-service:4106
      - SALARY_SERVICE_URL=http://salary-service:4107
      - JOB_SERVICE_URL=http://job-service:4111
      - NOTIFICATION_SERVICE_URL=http://notification-service:4110
      # Rate limiting
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
    env_file:
      - ./services/api-gateway/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hrms-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # --------------------------------------------------------------------------
  # Auth Service - Authentication & Authorization (Port 4101)
  # --------------------------------------------------------------------------
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: hrms-auth-service
    restart: unless-stopped
    volumes:
      # Hot reload support
      - ./services/auth-service:/app
      - /app/node_modules
      # Shared volume for identification photos
      - identification-photos:/app/public/identificationPhoto
    environment:
      - PORT=4101
      - NODE_ENV=production
      # Database
      - DB_TYPE=pg
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_DATABASE=auth_service
      # Email Default (Secrets from env_file will override)
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=465
      # URLs
      - FRONTEND_URL=https://virgilio-wolfish-nonracially.ngrok-free.dev
      - EMPLOYEE_SERVICE_URL=http://employee-service:4102
      - AI_SERVICE_URL=http://ai-face-recognition-service:4106
      - API_GATEWAY_URL=http://api-gateway:4100
    env_file:
      - ./services/auth-service/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hrms-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # --------------------------------------------------------------------------
  # Employee Service - Employee management (Port 4102)
  # --------------------------------------------------------------------------
  employee-service:
    build:
      context: ./services/employee-service
      dockerfile: Dockerfile
    container_name: hrms-employee-service
    restart: unless-stopped
    volumes:
      # Hot reload support
      - ./services/employee-service:/app
      - /app/node_modules
    environment:
      - PORT=4102
      - NODE_ENV=production
      # Database
      - DB_TYPE=pg
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_DATABASE=employee_service
      # Service URLs
      - AUTH_SERVICE_URL=http://auth-service:4101
      - SALARY_SERVICE_URL=http://salary-service:4107
      - API_GATEWAY_URL=http://api-gateway:4100
      - PREFIXADMIN=admin
    env_file:
      - ./services/employee-service/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - hrms-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # --------------------------------------------------------------------------
  # Attendance Service - Time tracking & attendance (Port 4103)
  # --------------------------------------------------------------------------
  attendance-service:
    build:
      context: ./services/attendance-service
      dockerfile: Dockerfile
    container_name: hrms-attendance-service
    restart: unless-stopped
    volumes:
      # Hot reload support
      - ./services/attendance-service:/app
      - /app/node_modules
    environment:
      - PORT=4103
      - NODE_ENV=production
      # Database
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_DATABASE=attendance_service
      # Service URLs
      - AUTH_SERVICE_URL=http://auth-service:4101
      - EMPLOYEE_SERVICE_URL=http://employee-service:4102
      - API_GATEWAY_URL=http://api-gateway:4100
      - APPLICATION_SERVICE_URL=http://application-service:4108
    env_file:
      - ./services/attendance-service/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hrms-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # --------------------------------------------------------------------------
  # Application Service - Job applications management (Port 4108)
  # --------------------------------------------------------------------------
  application-service:
    build:
      context: ./services/application-service
      dockerfile: Dockerfile
    container_name: hrms-application-service
    restart: unless-stopped
    environment:
      - PORT=4108
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_DATABASE=application_service
      - AUTH_SERVICE_URL=http://auth-service:4101
      - EMPLOYEE_SERVICE_URL=http://employee-service:4102
      - API_GATEWAY_URL=http://api-gateway:4100
    env_file:
      - ./services/application-service/.env.docker
    volumes:
      # Persistent upload storage
      - application-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hrms-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # --------------------------------------------------------------------------
  # AI Face Recognition Service - Face detection & recognition (Port 4106)
  # --------------------------------------------------------------------------
  ai-face-recognition-service:
    build:
      context: ./services/ai-face-recognition-service
      dockerfile: Dockerfile
    container_name: hrms-ai-face-service
    restart: unless-stopped
    ports:
      - "4106:4106" # Expose AI service port for debugging
    environment:
      - PORT=4106
      - DEBUG=False
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_NAME=ai_face_recognition
      - MODEL_NAME=buffalo_l
      - FACE_CONFIDENCE_THRESHOLD=0.6
      - RECOGNITION_THRESHOLD=0.4
      - API_GATEWAY_URL=http://api-gateway:4100
    env_file:
      - ./services/ai-face-recognition-service/.env.docker
    volumes:
      # Model cache and uploads
      - ai-models:/app/models
      - ai-uploads:/app/uploads
      # Shared volume for identification photos
      - identification-photos:/app/public/identificationPhoto
      # Hot reload for Python (optional, but helpful for dev)
      - ./services/ai-face-recognition-service/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hrms-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # --------------------------------------------------------------------------
  # Salary Service - Payroll management (Port 4107)
  # --------------------------------------------------------------------------
  salary-service:
    build:
      context: ./services/salary-service
      dockerfile: Dockerfile
    container_name: hrms-salary-service
    restart: unless-stopped
    volumes:
      # Hot reload support
      - ./services/salary-service:/app
      - /app/node_modules
    environment:
      - PORT=4107
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_DATABASE=salary_service
      - EMPLOYEE_SERVICE_URL=http://employee-service:4102
      - AUTH_SERVICE_URL=http://auth-service:4101
      - ATTENDANCE_SERVICE_URL=http://attendance-service:4103
      - API_GATEWAY_URL=http://api-gateway:4100
    env_file:
      - ./services/salary-service/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      employee-service:
        condition: service_started
    networks:
      - hrms-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # --------------------------------------------------------------------------
  # Job Service - Job postings & AI matching (Port 4111)
  # --------------------------------------------------------------------------
  job-service:
    build:
      context: ./services/job-service
      dockerfile: Dockerfile
    container_name: hrms-job-service
    restart: unless-stopped
    volumes:
      # Hot reload support
      - ./services/job-service:/app
      - /app/node_modules
    environment:
      - PORT=4111
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_DATABASE=job_service
      - AUTH_SERVICE_URL=http://auth-service:4101
      - API_GATEWAY_URL=http://api-gateway:4100
    env_file:
      - ./services/job-service/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hrms-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # --------------------------------------------------------------------------
  # Notification Service - Real-time notifications (Port 4110)
  # --------------------------------------------------------------------------
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: hrms-notification-service
    restart: unless-stopped
    volumes:
      # Hot reload support
      - ./services/notification-service:/app
      - /app/node_modules
    environment:
      - PORT=4110
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_DATABASE=notification_service
      - AUTH_SERVICE_URL=http://auth-service:4101
      - API_GATEWAY_URL=http://api-gateway:4100
    env_file:
      - ./services/notification-service/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hrms-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # --------------------------------------------------------------------------
  # CV Analysis Worker - Process CV uploads with AI (Background)
  # Deploy 3 replicas for parallel processing with Round-Robin
  # --------------------------------------------------------------------------
  cv-worker:
    build:
      context: ./services/job-service
      dockerfile: Dockerfile
    # Remove container_name to allow multiple instances
    restart: unless-stopped
    command: [ "yarn", "worker" ]
    volumes:
      - ./services/job-service:/app
      - /app/node_modules
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - API_GATEWAY_URL=http://api-gateway:4100
      - AUTH_SERVICE_URL=http://auth-service:4101
      - NOTIFICATION_SERVICE_URL=http://notification-service:4110
    env_file:
      - ./services/job-service/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      job-service:
        condition: service_started
    networks:
      - hrms-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # --------------------------------------------------------------------------
  # Salary Calculation Worker - Process payroll calculations (Background)
  # Deploy 3 replicas for parallel processing with Round-Robin
  # --------------------------------------------------------------------------
  salary-worker:
    build:
      context: ./services/salary-service
      dockerfile: Dockerfile
    # Remove container_name to allow multiple instances
    restart: unless-stopped
    command: [ "yarn", "worker" ]
    volumes:
      - ./services/salary-service:/app
      - /app/node_modules
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_DATABASE=salary_service
      - EMPLOYEE_SERVICE_URL=http://employee-service:4102
      - ATTENDANCE_SERVICE_URL=http://attendance-service:4103
      - NOTIFICATION_SERVICE_URL=http://notification-service:4110
      - AI_SERVICE_URL=http://ai-face-recognition-service:4106
      - AUTH_SERVICE_URL=http://auth-service:4101
      - API_GATEWAY_URL=http://api-gateway:4100
    env_file:
      - ./services/salary-service/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      salary-service:
        condition: service_started
    networks:
      - hrms-network
    healthcheck:
      disable: true
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # --------------------------------------------------------------------------
  # Nginx - Reverse Proxy for both Frontend and Backend
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: hrms-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - identification-photos:/usr/share/nginx/html/identificationPhoto:ro
    ports:
      - "8080:80" # Local access: http://localhost:8080
    depends_on:
      - frontend
      - api-gateway
    networks:
      - hrms-network

  # --------------------------------------------------------------------------
  # Ngrok - Tunnel for public access (Both Mobile and Web)
  # --------------------------------------------------------------------------
  ngrok:
    image: ngrok/ngrok:latest
    container_name: hrms-ngrok-tunnel
    restart: unless-stopped
    command:
      - "http"
      - "--domain=virgilio-wolfish-nonracially.ngrok-free.dev"
      - "nginx:80" # Trỏ vào Nginx thay vì chỉ api-gateway
    environment:
      - NGROK_AUTHTOKEN=38YqLD61qmRQS0fylDitgv8D92p_oD8UdrnroV6j9jjvn5kv
    ports:
      - "4041:4040"
    depends_on:
      - nginx
    networks:
      - hrms-network

# ============================================================================
# NETWORKS - Internal communication
# ============================================================================
networks:
  hrms-network:
    driver: bridge
    name: hrms-microservices-network

# ============================================================================
# VOLUMES - Persistent data storage
# ============================================================================
volumes:
  postgres-data:
    name: hrms-postgres-data
  application-uploads:
    name: hrms-application-uploads
  ai-models:
    name: hrms-ai-models
  ai-uploads:
    name: hrms-ai-uploads
  identification-photos:
    name: hrms-identification-photos
